<body><div class="wrap"><header><div class="brand">ことばのノート　／　日常日本語</div><div class="label">JAPANESE WORDS · 01</div></header><main><div class="hero"><div><div class="eyebrow">はじめての日本語　—　單元 01</div><h1>每天一點，<br>把日文放進日常。</h1></div><p class="intro">從生活中最常遇見的詞彙開始。聽讀音、看例句，慢慢累積自己的日語感。</p></div><div class="unitbar"><nav class="tabs" aria-label="課次分類"><button class="tab active" data-group="all">全部</button><button class="tab" data-group="l1">第一課</button><button class="tab" data-group="l2">第二課</button><button class="tab" data-group="l34">第三・四課</button><button class="tab" data-group="l4">第四課</button><button class="tab" data-group="l5">第五課</button></nav><div class="count" id="count">LESSON · P.08–27</div></div><section class="cards" id="cards" aria-live="polite"></section><section class="practice"><div><h2>今日小練習</h2><p id="prompt">點一下卡片上的喇叭，聽聽看日文怎麼念。</p></div><button class="quiz" id="quiz">隨機抽一個單字 ↗</button></section><p class="intro" style="margin:20px 0 0;font-size:11px">詞彙依講義課次與頁碼分類：第一課第 8–11 頁、第二課第 12–15 頁、第三／四課日期時間第 16–21 頁、第四課第 22–24 頁、第五課第 25–27 頁。</p></main><footer><span>ことばのノート　・　單字練習室</span><span>插畫：OpenMoji · CC BY-SA 4.0</span></footer></div>

const cards=document.querySelector('#cards'),count=document.querySelector('#count');function render(group='all'){const list=group==='all'?words:words.filter(w=>w.lesson===group);count.textContent=`${group==='all'?'ALL LESSONS':({l1:'LESSON 01 · P.08–11',l2:'LESSON 02 · P.12–15',l34:'LESSON 03–04 · P.16–21',l4:'LESSON 04 · P.22–24',l5:'LESSON 05 · P.25–27'}[group])} / ${list.length} WORDS`;cards.innerHTML=list.map((w,i)=>`<article class="word"><div class="lesson-tag">${({l1:'第一課',l2:'第二課',l34:'第三・四課',l4:'第四課',l5:'第五課'}[w.lesson])}</div><button class="sound" aria-label="播放 ${w.jp}" data-say="${w.jp}">▶</button><div class="illustration"><img loading="lazy" src="https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@16.0.0/color/svg/${cues[w.jp].icon}.svg" alt="${w.meaning}插畫"></div><div class="jp" lang="ja">${w.jp}</div><div class="kana">假名・${w.kana}</div><div class="kanji" lang="ja">漢字・<em>${w.kanji||'通常以假名書寫'}</em></div><div class="meaning">${w.meaning}</div><div class="memory"><b>諧音聯想</b>${cues[w.jp].memory}</div><div class="example" lang="ja">${w.ex}<span>${w.zh}</span></div></article>`).join('');document.querySelectorAll('.sound').forEach(b=>b.onclick=()=>speak(b.dataset.say))}function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';speechSynthesis.speak(u)}else document.querySelector('#prompt').textContent='此瀏覽器目前不支援語音播放。'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');render(b.dataset.group)});document.querySelector('#quiz').onclick=()=>{const w=words[Math.floor(Math.random()*words.length)];document.querySelector('#prompt').textContent=`「${w.jp}」是什麼意思？答案：${w.meaning}`;speak(w.jp)};render();
